# ============================================
# Local AI Voice Agent - Configuration
# ============================================

# --- LLM Settings (Ollama) ---
llm:
  # Model to use. Popular choices:
  #   llama3.1:8b    - Great general purpose (needs ~6GB RAM)
  #   mistral:7b     - Fast and smart (needs ~5GB RAM)
  #   gemma2:9b      - Good for conversation (needs ~7GB RAM)
  #   phi3:mini      - Lightweight (needs ~3GB RAM)
  #   llama3.1:70b   - Best quality, needs beefy GPU (~40GB VRAM)
  model: "llama3.1:8b"
  ollama_host: "http://localhost:11434"
  # System prompt that defines your AI's personality
  system_prompt: |
    You are a helpful personal AI assistant running locally on the user's computer.
    You are friendly, concise, and direct. Keep responses short and conversational
    since the user is talking to you by voice. Aim for 1-3 sentences unless they
    ask for something detailed. You can help with questions, tasks, coding,
    writing, math, and general knowledge.
  # Max tokens in response
  max_tokens: 512
  # Temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7
  # How many previous exchanges to remember
  context_window: 20

# --- Speech-to-Text Settings (Whisper) ---
stt:
  # Model size: tiny, base, small, medium, large-v3
  # tiny   = fastest, least accurate (~1GB RAM)
  # base   = good balance (~1GB RAM)
  # small  = better accuracy (~2GB RAM)
  # medium = great accuracy (~5GB RAM)
  # large-v3 = best accuracy (~10GB RAM)
  model: "base"
  # Language (use "en" for English-only model which is faster)
  language: "en"
  # Device: "cpu" or "cuda" (GPU)
  device: "cpu"

# --- Text-to-Speech Settings (Piper) ---
tts:
  # Voice model - will be auto-downloaded on first run
  # Options: en_US-amy-medium, en_US-lessac-medium, en_GB-alan-medium
  voice: "en_US-amy-medium"
  # Speech rate (1.0 = normal)
  rate: 1.0

# --- Voice Activity Detection ---
vad:
  # Silence threshold in seconds - how long to wait after you stop talking
  silence_threshold: 1.5
  # Minimum speech duration in seconds to process
  min_speech_duration: 0.5

# --- Wake Word (optional) ---
wake_word:
  enabled: false
  # Word/phrase to activate listening (requires pocketsphinx)
  word: "hey computer"

# --- Audio Settings ---
audio:
  # Sample rate for recording
  sample_rate: 16000
  # Audio chunk size
  chunk_size: 1024
  # Input device index (null = default microphone)
  input_device: null
  # Output device index (null = default speaker)
  output_device: null

# --- Logging ---
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "~/.local/share/ai-agent/agent.log"
