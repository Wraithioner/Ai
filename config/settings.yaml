# ============================================
# AI Telegram Bot - Configuration
# ============================================
# All values can be overridden by environment
# variables on Railway (Settings > Variables).
# ============================================

# --- Telegram Bot ---
telegram:
  # Bot token from @BotFather (set via TELEGRAM_BOT_TOKEN env var on Railway)
  bot_token: ""
  # Telegram user ID of the bot owner — gets admin commands
  # (set via OWNER_ID env var on Railway)
  owner_id: 0
  # Max concurrent users kept in memory (oldest evicted when exceeded)
  max_users: 100

# --- Arena Platform ---
arena:
  # All Arena values are set via env vars on Railway:
  #   ARENA_API_KEY, ARENA_AGENT_ID, ARENA_HANDLE,
  #   ARENA_VERIFICATION_CODE, ARENA_WALLET, ARENA_WALLET_PRIVATE_KEY
  api_key: ""
  agent_id: ""
  handle: ""
  verification_code: ""
  wallet: ""
  wallet_private_key: ""

# --- LLM Settings ---
llm:
  # HuggingFace model (auto-downloaded on first run)
  #   Qwen/Qwen2.5-1.5B-Instruct  - Lighter, works on CPU (~3GB RAM)
  #   TinyLlama/TinyLlama-1.1B-Chat-v1.0 - Tiny, very fast (~2GB RAM)
  #   Qwen/Qwen2.5-7B-Instruct    - Smart, needs GPU (~14GB VRAM)
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  # System prompt — defines the bot's personality
  system_prompt: |
    You are a helpful AI assistant running as a Telegram bot.
    You are friendly, concise, and direct. Keep responses short
    and conversational. You can help with questions, coding,
    writing, math, and general knowledge.
  # Max tokens in response
  max_tokens: 512
  # Temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7
  # How many previous exchanges to remember per user
  context_window: 10

# --- Safety ---
safety:
  enabled: true
  # Max messages per user per minute (prevents abuse)
  max_messages_per_minute: 15

# --- Logging ---
logging:
  # DEBUG, INFO, WARNING, ERROR
  # Railway captures stdout automatically — no file needed
  level: "INFO"
